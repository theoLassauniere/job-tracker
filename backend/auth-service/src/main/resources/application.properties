quarkus.application.name=auth-service
quarkus.http.port=${HTTP_PORT:8081}

# PostgreSQL - base dediee au service (pas de base partagee entre services)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:auth}
quarkus.datasource.password=${DB_PASSWORD:auth}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/auth}

quarkus.hibernate-orm.database.generation=${DB_GENERATION:update}
