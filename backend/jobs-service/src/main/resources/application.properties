quarkus.application.name=jobs-service
quarkus.http.port=${HTTP_PORT:8082}

# PostgreSQL - base dediee au service (pas de base partagee entre services)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:jobs}
quarkus.datasource.password=${DB_PASSWORD:jobs}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/jobs}

quarkus.hibernate-orm.database.generation=${DB_GENERATION:update}
