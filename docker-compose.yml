services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobtracker}
      POSTGRES_USER: ${POSTGRES_USER:-jobtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobtracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobtracker} -d ${POSTGRES_DB:-jobtracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  auth-service:
    build: ./backend/auth-service
    environment:
      HTTP_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobtracker}
      DB_USERNAME: ${POSTGRES_USER:-jobtracker}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-jobtracker}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  jobs-service:
    build: ./backend/jobs-service
    environment:
      HTTP_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobtracker}
      DB_USERNAME: ${POSTGRES_USER:-jobtracker}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-jobtracker}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build: ./backend/gateway
    environment:
      HTTP_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      JOBS_SERVICE_URL: http://jobs-service:8082
    depends_on:
      auth-service:
        condition: service_started
      jobs-service:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - gateway
    ports:
      - "3000:80"

volumes:
  pgdata:
